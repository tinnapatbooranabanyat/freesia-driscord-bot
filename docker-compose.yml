services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    volumes:
      - ./data:/app/data   # ความจำแชท, persona, เพลย์ลิสต์ (SQLite)
      # ถ้าใช้ไฟล์ cookies ของ YouTube: วาง cookies.txt ไว้ข้างไฟล์นี้, เปิดบรรทัดล่าง และตั้ง YTDL_COOKIES=/app/cookies.txt ใน .env
      # - ./cookies.txt:/app/cookies.txt
